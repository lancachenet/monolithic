# Observed origins use persistent connections; newly seen hosts retain normal DNS routing.
location / {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_pass http://$lancache_primary_backend$request_uri;
    proxy_intercept_errors on;
    error_page 301 302 307 = @upstream_redirect;
}
