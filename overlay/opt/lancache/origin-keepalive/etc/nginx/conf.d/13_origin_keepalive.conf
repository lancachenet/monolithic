# Parse redirects without changing their path or signed query parameters.
map $saved_upstream_location $lancache_redirect_host {
    default "";
    "~^https?://(?<lc_redirect_hostname>[^/:]+)(?::[0-9]+)?(?:/|$)" $lc_redirect_hostname;
}
map $saved_upstream_location $lancache_redirect_authority {
    default $proxy_host;
    "~^https?://(?<lc_redirect_authority>[^/]+)(?:/|$)" $lc_redirect_authority;
}
map $saved_upstream_location $lancache_redirect_url {
    default $saved_upstream_location;
    "~^http://[^/:]+(?::80)?(?<lc_redirect_path_http>/.*)$" "http://$lancache_redirect_http_backend$lc_redirect_path_http";
    "~^https://[^/:]+(?::443)?(?<lc_redirect_path_https>/.*)$" "https://$lancache_redirect_https_backend$lc_redirect_path_https";
}
log_format lancache_origin_names escape=json '{"host":"$host","redirect_host":"$lancache_redirect_host"}';

# An intercepted 302 response cannot return its external connection to the pool.
# Let this local transport finish reading the response before the redirect handler
# discards it. Only observed redirect issuers take this extra hop.
upstream lancache_redirect_gateway {
    server 127.0.0.1:3129;
    keepalive 64;
    keepalive_requests 10000;
    keepalive_timeout 30s;
}
server {
    listen 127.0.0.1:3129;
    access_log off;
    error_log /data/logs/upstream-error.log;
    include /etc/nginx/sites-available/upstream.conf.d/10_resolver.conf;
    location / {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering on;
        proxy_ignore_client_abort on;
        proxy_pass http://$lancache_origin_backend$request_uri;
    }
}

upstream lancache_internal_relay {
    server 127.0.0.1:3128;
    keepalive 64;
    keepalive_requests 10000;
    keepalive_timeout 30s;
}

# Generated numeric addresses are refreshed without changing cache keys or slice sizes.
include /data/info/cdn-origin/upstreams.conf;
