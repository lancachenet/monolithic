  location = /lancache-whoami {
    default_type text/plain;
    add_header X-LanCache-Processed-By $hostname;
    echo "remote_addr: $remote_addr:$remote_port";
    echo "server: $server_addr:$server_port ($host)";
    echo "scheme: $scheme";
    echo "";
    echo -n $echo_client_request_headers;
  }
